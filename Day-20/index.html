<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Real-Time Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    <h1 class="title">Weather Dashboard</h1>

    <div class="search-box">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
      />
      <button id="fetchBtn">Get Weather</button>
    </div>

    <div id="weatherResult" class="weather-card"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
