<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <section class="hero">
        <div class="hero-content">
            <h1 class="neon-title">Welcome to Portfolio</h1>
            <p class="typewriter">Building amazing digital experiences</p>
            <label for="modal-toggle" class="cta-button">Notify Me</label>
        </div>
    </section>

    <section class="gallery">
        <h2>My Projects</h2>
        <div class="masonry">
            <div class="card" style="background: linear-gradient(135deg, #667eea, #764ba2);">01</div>
            <div class="card" style="background: linear-gradient(135deg, #f093fb, #f5576c);">02</div>
            <div class="card" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">03</div>
            <div class="card" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">04</div>
            <div class="card" style="background: linear-gradient(135deg, #fa709a, #fee140);">05</div>
            <div class="card" style="background: linear-gradient(135deg, #30cfd0, #330867);">06</div>
            <div class="card" style="background: linear-gradient(135deg, #a8edea, #fed6e3);">07</div>
            <div class="card" style="background: linear-gradient(135deg, #ff9a56, #ff6a88);">08</div>
            <div class="card" style="background: linear-gradient(135deg, #667eea, #764ba2);">09</div>
        </div>
    </section>

    <input type="checkbox" id="modal-toggle" class="modal-toggle">
    <div class="modal">
        <div class="modal-content">
            <label for="modal-toggle" class="close">&times;</label>
            <h2>Stay Updated</h2>
            <p>Get notified when new projects launch</p>
            <form>
                <input type="email" placeholder="Enter your email" required>
                <button type="submit">Notify Me</button>
            </form>
        </div>
    </div>
</body>
</html>
